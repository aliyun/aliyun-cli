name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    environment: CI
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Check Go formatting
      run: make check-fmt

    - name: Unit Test
      run: make test
    - name: Runtime Module Check
      run: make check-runtime
    - name: Packed metadata test
      run: make test-release
    - name: Upload coverage information
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.txt,./coverage-runtime.txt
        disable_search: true
        fail_ci_if_error: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Smoking Test
      run: go run ./main

    - run: |
        make build
        make install
        bash ./integration/vpc_test.sh
        bash ./integration/oss_test.sh
        bash ./integration/https_proxy.sh
      if: env.ACCESS_KEY_ID != '' && env.ACCESS_KEY_SECRET != '' && matrix.os != 'windows-latest'
      env:
        ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
        ACCESS_KEY_SECRET: ${{ secrets.ACCESS_KEY_SECRET }}
        REGION_ID: ${{ secrets.REGION_ID }}
